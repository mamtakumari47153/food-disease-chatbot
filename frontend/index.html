<!DOCTYPE html>
<html>
<head>
  <title>Food AI Chatbot</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
    }

    .container {
      width: 400px;
      margin: 50px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background: #4CAF50;
      color: white;
      padding: 15px;
      text-align: center;
    }

    #chatbox {
      height: 350px;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 75%;
    }

    .user {
      background: #DCF8C6;
      margin-left: auto;
    }

    .bot {
      background: #eee;
      margin-right: auto;
    }

    .footer {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
    }

    button {
      margin-left: 5px;
      padding: 8px;
      background: green;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="header">🍎 Food Detection Chatbot</div>

  <div id="chatbox"></div>

  <div class="footer">
    <input type="file" id="fileInput">
    <button onclick="sendImage()">Send</button>
  </div>
</div>

<!-- ✅ JS MUST BE HERE -->
<script>
async function sendImage() {
  const fileInput = document.getElementById("fileInput");
  const file = fileInput.files[0];

  if (!file) {
    alert("Please select a file");
    return;
  }

  const chatbox = document.getElementById("chatbox");

  chatbox.innerHTML += `<div class="msg user">📤 ${file.name}</div>`;

  const formData = new FormData();
  formData.append("file", file);

  try {
    const response = await fetch("http://localhost:8000/chat/", {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    chatbox.innerHTML += `<div class="msg bot">🤖 ${data.bot}</div>`;
    chatbox.scrollTop = chatbox.scrollHeight;

  } catch (error) {
    console.error(error);

    chatbox.innerHTML += `
      <div class="msg bot">❌ Error connecting to server</div>
    `;
  }
}
</script>

</body>
</html>
